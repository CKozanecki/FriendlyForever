# Every file scripts/dev-setup.sh downloads, with its SHA-256 (#103).
# One file per line: name, SHA-256, then one or more https URLs. The script
# tries the URLs in order only when a host can't be reached; a file that
# arrives with any other checksum stops the install.
#
# Where each checksum came from (never only from the download itself):
# - hererocks: PyPI's published digest (pypi.org/pypi/hererocks/0.25.1/json).
# - Lua 5.1.5: the checksum table inside hererocks 0.25.1, kept by the
#   LuaRocks project, and Launchpad's listing for Debian's lua5.1 5.1.5
#   source, an unchanged copy of the lua.org tarball (Ubuntu serves the same
#   file). hererocks checks it again before building.
# - LuaRocks 3.8.0: the checksum table inside hererocks 0.25.1. No second
#   published SHA-256 was found; CI's download from luarocks.github.io has to
#   match it, and hererocks checks it again.
# - Rocks and rockspecs: luarocks.org publishes no checksums, so these are from
#   the LuaRocks mirror on GitHub (rocks-moonscript-org/moonrocks-mirror). CI
#   downloads them from luarocks.org, so two hosts have to agree.
# - lua-term and mediator_lua, published as rockspecs only: their release
#   sources as Debian packages them (Launchpad's listing of the .orig.tar.gz),
#   fetched from Ubuntu's archive. GitHub serves source archives to cloud
#   sessions only for repositories attached to them, so GitHub isn't used.
#
# Changing a version means changing scripts/dev-setup.sh and this file
# together, with a new checksum from a source other than the download.

