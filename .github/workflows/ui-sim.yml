name: UI simulator

# The headless WoW UI simulator wow-ui-sim (issue #49), adopted at level B:
# UI scenarios with layout checks, and screenshots for reviewers. Report
# only: its results never fail CI, and nothing it produces is trusted. See
# "UI simulator" in CONTRIBUTING.md.
#
# Safety:
# - The simulator is built here from one reviewed commit of its source
#   (936d5f5, #160), with every base image pinned by digest, so it can't
#   change under us; read the source at a new commit before moving the pin.
#   There's no published image at that commit, and we never use the
#   project's release binaries.
# - No job has secrets, and every job but publish-screenshots has read-only
#   access to the repository.
# - Every container runs with no capabilities and no privilege escalation,
#   and sees its inputs read-only. Building and running the simulator have
#   no network. Two steps do, and neither builds or runs the simulator:
#   - the one that downloads the locked crates, and runs none of their code;
#   - the one that downloads Forever's spell data with the simulator's own
#     tool (#160, the owner's decision). Its container sits on a network
#     with no route out. It reaches only a proxy, which lets through only
#     HTTPS tunnels to the hosts in SPELL_DATA_HOSTS, on port 443. What it
#     writes must match SPELL_DATA_SHA256, or the job stops before anything
#     is cached, uploaded or run.
# - We don't use the project's own Action: it pulls a moving tag, mounts
#   the repository read-write and puts an input into a shell command
#   unquoted.
# - Only the publish-screenshots job may write, and it runs nothing from the
#   simulator or the pull request.

# Runs on every pull request and push to main, and decides inside the
# workflow (the `changes` job) whether anything that can change what players
# see was touched (#218). The workflow has no `paths:` filter on purpose: a
# filtered-out workflow never reports, and a check that never reports leaves
# a required check pending. The UI simulator's jobs are not required, but
# deciding inside keeps that true for any check. On main, a run that builds
# the simulator keeps its build cached for pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's newer push replaces its older run. Each push to main is
# its own group, so a later push that touches no UI file can't cancel an
# earlier one's run, which keeps the simulator build cached.
concurrency:
  group: ui-sim-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The screen sizes the layout checks and screenshots run at (#148):
  # 1024 x 768 is the narrowest layout WoW lays out; 1920 x 1080 is what
  # most players use. spec/repo_spec.lua checks both are listed.
  LAYOUT_SIZES: 1024x768 1920x1080
  SIM_REPO: https://github.com/Osso/wow-ui-sim.git
  # The head of their master on 2026-11-13, with the Forever profile, its
  # spell data and our three contributions (#100); reviewed on #160.
  SIM_COMMIT: 936d5f53841ee620384b7f05a0f8d5e861835c3d
  # The client the simulator plays: WoW Forever, the game the addon ships
  # for (#160, the owner's decision). It names the Blizzard UI cache folder
  # and the spell data folder.
  SIM_PROFILE: wowforever
  # Forever's UI code, at the commit and version SIM_COMMIT's
  # data/blizzard-ui-builds/wowforever.json names; the fetch step checks both.
  BLIZZARD_UI_COMMIT: aff0d8cd53bf4d9ef1c1dd2786b94461a276fb16
  BLIZZARD_UI_VERSION: 1.60.1.70707
  # SIM_COMMIT's rust-toolchain.toml asks for Rust 1.99.1. BUILD_TOOLCHAIN
  # tells rustup to use the image's own toolchain, so it never tries to
  # download one. Running uses the same Debian, so the binary finds the ICU
  # it was linked with.
  BUILD_BASE: rust@sha256:e6f2cff35d0f309acf8433b4f05878ed77092602c5065cc81801177da0bb3a9c # 1.99.1-bookworm
  BUILD_TOOLCHAIN: 1.99.1
  # What the build uses; the cache key covers each (#170). "tools" builds
  # wow-cli, which downloads the spell data.
  BUILD_PACKAGES: clang mold git pkg-config cmake libicu-dev libudev-dev
  BUILD_FEATURES: gui client-wowforever tools
  BUILD_STRIP: symbols
  # Forever's spell data (#160): the hosts its download may reach, all on
  # port 443 (the discovery host, then Blizzard's CDN), and the SHA-256 of
  # what it must write. The simulator's own code checks every downloaded
  # chunk against keys pinned in its source before decoding it.
  SPELL_DATA_HOSTS: us.version.battle.net level3.ssl.blizzard.com us.cdn.blizzard.com kr.cdn.blizzard.com
  # Taken from this workflow's first run on #314, after #160's review of the
  # download code; the row check below ties it to our committed copy. In
  # quotes: YAML would read a hash of digits as a number.
  SPELL_DATA_SHA256: "baafb9369a8214a5d793fba12cadec875f7f4a0c4ff8e569d6faac21b2bcac7b"
  RENDER_BASE: debian@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3 # bookworm-slim
  # The one font file every wow-sim run draws and measures text in (#310).
  # With no game fonts the simulator would use the first system face its font
  # library lists, and nothing fixes which of DejaVu's faces that is: runs of
  # one commit drew sans in one job and serif in another. It's DejaVuSans.ttf
  # of the render image's fonts-dejavu-core; the image build fails if the file
  # isn't there, since the simulator only warns and falls back.
  RENDER_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

jobs:
  # Decides whether the UI simulator has anything to look at (#218): true if
  # the pull request (or the push to main) changes a file that can change
  # what players see, or the run was started by hand. Every doubt says true:
  # no usable diff, a first push, a failure here. Nothing from the pull
  # request is run, only listed by git; a file name is shown only after
  # everything but plain characters is replaced.
  #
  # The UI files are the root Lua files that create frames (grep CreateFrame
  # *.lua), the ones the options panel is built from, Colours.lua (the palette
  # every colour comes from), BuffData.lua and BuffRules.lua (they decide text
  # the Buff Back tab shows, #226), the scenarios, the
  # art, the packaging inputs, the simulator harness, the spell data check
  # and the copy it checks against (#160), and this workflow. A
  # change to anything else, such as Greeter.lua or GroupBuffs.lua, skips the
  # jobs below; a skipped job counts as passing.
  #
  # Two changes to a UI file can't change what players see, so they skip too
  # (#241): a TOC whose only changed line is `## Version:` (the Interface line
  # and the file list still count), and a root Lua file whose only changes are
  # `--` comments and blank lines. Both versions are read with git show and
  # compared as text; nothing in them runs. A file added, deleted or unreadable
  # on either side, either side holding a NUL byte, Lua with a long bracket
  # ([[ or [=, where a -- can be inside a string), a line ending in a backslash
  # or a carriage return inside a line (Lua reads one as a line break) is
  # doubt, and runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out whether a UI file changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          answer() { echo "ui=$1" >> "$GITHUB_OUTPUT"; echo "UI simulator: $1 ($2)"; exit 0; }
          [ "$EVENT" = workflow_dispatch ] && answer true "started by hand"
          # A pull request runs on GitHub's merge commit: its first parent is
          # the base, so the diff is what the pull request changes. A push to
          # main compares with the commit before it.
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          else
            case "$BEFORE" in *[!0-9a-f]* | "" | 0000000000000000000000000000000000000000) answer true "no commit to compare with" ;; esac
            base=$BEFORE
          fi
          list=$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD) || answer true "no diff"
          [ -n "$list" ] || answer true "no changed files"
          # Both versions of a file, or a failure when either side has none or
          # holds a NUL byte, which bash would drop unseen (#241).
          both() {
            for side in "$base" HEAD; do
              [ "$(git show "$side:$1" 2>/dev/null | tr -dc '\000' | wc -c)" -eq 0 ] || return 1
            done
            old=$(git show "$base:$1" 2>/dev/null) && new=$(git show "HEAD:$1" 2>/dev/null)
          }
          # The same TOC once its ## Version: lines are left out. A carriage
          # return inside a line could start another line, so it is doubt.
          version_only() {
            both "$1" || return 1
            printf '%s\n%s\n' "$old" "$new" | awk '/\r[^\n]/ { exit 2 }' || return 1
            [ "$(printf '%s\n' "$old" | grep -v '^## Version:')" = "$(printf '%s\n' "$new" | grep -v '^## Version:')" ]
          }
          # Lua without -- comments, blank lines and trailing spaces. A comment
          # is cut only where no quote comes before it on its line; a long
          # bracket, a line ending in a backslash or a carriage return inside a
          # line fails (exit 2).
          strip_lua() {
            awk '/\[\[|\[=|\\\r?$|\r[^\n]/ { exit 2 }
              { sub(/\r$/, ""); i = index($0, "--"); if (i > 0 && substr($0, 1, i - 1) !~ /["'\'']/) $0 = substr($0, 1, i - 1)
                sub(/[ \t]+$/, ""); if ($0 != "") print }'
          }
          comments_only() {
            both "$1" || return 1
            a=$(printf '%s\n' "$old" | strip_lua) && b=$(printf '%s\n' "$new" | strip_lua) && [ "$a" = "$b" ]
          }
          while IFS= read -r file; do
            hit=no
            case "$file" in
              */*)
                case "$file" in
                  uitests/* | Media/* | .github/workflows/ui-sim.yml | scripts/package.sh | scripts/ui-sim-harness.lua \
                    | scripts/sim-spell-check.py | scripts/data/forever-spells.json) hit=yes ;;
                esac ;;
              *)
                case "$file" in
                  .pkgmeta | *.toc | *.xml) hit=yes ;;
                  Battleground.lua | BuffButton.lua | BuffData.lua | BuffList.lua | BuffMode.lua | BuffModeAuto.lua | BuffRules.lua | ChatQueue.lua | Core.lua \
                    | Colours.lua | Minimap.lua | Nameplates.lua | Options.lua | OptionsIndex.lua | Walkthrough.lua | Water.lua \
                    | Window.lua) hit=yes ;;
                esac ;;
            esac
            [ "$hit" = yes ] || continue
            safe=$(printf '%s' "${file:0:100}" | tr -c 'A-Za-z0-9._/-' '?')
            case "$file" in
              */*) ;;
              *.toc) version_only "$file" && { echo "$safe: only its version changed"; continue; } ;;
              *.lua) comments_only "$file" && { echo "$safe: only comments changed"; continue; } ;;
            esac
            answer true "$safe changed"
          done <<< "$list"
          answer false "no UI file changed"

  # Builds the simulator once, with its renderer, for both jobs below: the
  # way SIM_COMMIT's Dockerfile does for its Forever image, and renders on
  # the CPU with Mesa's software driver. It also fetches Forever's UI code at
  # its pinned commit, and downloads Forever's spell data, which the Forever
  # profile won't start without. No Blizzard art is fetched, so Blizzard's
  # textures are missing: text, layout and our own colors show.
  #
  # The finished, staged build is cached (#170), keyed on everything that
  # shapes it, so it is rebuilt only when a pin or a build setting moves. On
  # a hit the job goes straight to the checks and the upload. The older cache
  # of cargo's home and target directories is gone: each run checks the
  # simulator out fresh, so the timestamps changed and cargo recompiled the
  # simulator's own crates anyway (about 2.5 minutes), and it cost 25 s to
  # restore. A pull request's cache is visible only to that pull request; it
  # can read main's but can't write it.
  #
  # The build runs the simulator's build scripts and macros, so it is
  # sandboxed like the simulator itself: cargo first downloads the locked,
  # checksummed crates (it runs none of their code), then compiles with no
  # network, no capabilities and the sources read-only. Its output goes to
  # the other jobs as an artifact: the stripped binary, the test framework
  # run-tests loads from beside it, the spell data and Blizzard's UI code.
  # Whatever comes out of the cache is as untrusted as a fresh build: the
  # runner checks it holds only plain files and the spell data's hash, and
  # copies nothing else, and only a sandbox runs it.
  simulator:
    needs: changes
    # Not when no UI file changed; an empty answer (the job above failed) runs.
    if: ${{ needs.changes.outputs.ui != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    continue-on-error: true
    steps:
      # The workflow file itself is in the key, so editing any build or
      # staging step (a flag, a marker, a copied folder) misses the cache and
      # is built and checked in the run that changes it, never hidden by a
      # hit. Only this file is checked out, with the two the spell data
      # check reads (#160).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/ui-sim.yml
            scripts/sim-spell-check.py
            scripts/data/forever-spells.json
          sparse-checkout-cone-mode: false

      # One hash over every input of the build below. Change any of them and
      # the key, and so the cache, changes. spec/repo_spec.lua checks each
      # setting the build steps use is named here.
      - name: Work out the cache key from the build's inputs
        id: key
        env:
          WORKFLOW_HASH: ${{ hashFiles('.github/workflows/ui-sim.yml') }}
          SPELL_CHECK_HASH: ${{ hashFiles('scripts/sim-spell-check.py', 'scripts/data/forever-spells.json') }}
        run: |
          # hashFiles gives '' when the file wasn't checked out; refuse that
          # rather than cache without it.
          test -n "$WORKFLOW_HASH"
          test -n "$SPELL_CHECK_HASH"
          inputs="$(printf '%s\n' \
            "workflow=$WORKFLOW_HASH" \
            "sim=$SIM_COMMIT" \
            "profile=$SIM_PROFILE" \
            "blizzard-ui=$BLIZZARD_UI_COMMIT" \
            "blizzard-ui-version=$BLIZZARD_UI_VERSION" \
            "build-base=$BUILD_BASE" \
            "toolchain=$BUILD_TOOLCHAIN" \
            "packages=$BUILD_PACKAGES" \
            "features=$BUILD_FEATURES" \
            "strip=$BUILD_STRIP" \
            "spell-hosts=$SPELL_DATA_HOSTS" \
            "spell-data=$SPELL_DATA_SHA256" \
            "spell-check=$SPELL_CHECK_HASH")"
          echo "key=wow-ui-sim-build-$(printf '%s' "$inputs" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore the staged simulator build
        id: sim-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ui-sim-build
          key: ${{ steps.key.outputs.key }}

      - name: Fetch the simulator and Blizzard's UI code at their pinned commits
        if: steps.sim-cache.outputs.cache-hit != 'true'
        run: |
          # File names from the two outside repositories are untrusted (#153,
          # #317): see the ui-sim job's shown.
          shown() { tr '\r' '\n' | sed -e "s/^/${1:-| }/" -e 's/##\[/##(/g'; }
          git init -q "$RUNNER_TEMP/sim"
          git -C "$RUNNER_TEMP/sim" fetch -q --depth 1 "$SIM_REPO" "$SIM_COMMIT"
          git -C "$RUNNER_TEMP/sim" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sim" rev-parse HEAD)" = "$SIM_COMMIT"

          ui="$RUNNER_TEMP/blizzard-ui"
          git init -q "$ui"
          git -C "$ui" fetch -q --depth 1 https://github.com/Gethe/wow-ui-source.git "$BLIZZARD_UI_COMMIT"
          git -C "$ui" sparse-checkout set Interface/AddOns
          git -C "$ui" checkout -q --detach FETCH_HEAD
          test "$(git -C "$ui" rev-parse HEAD)" = "$BLIZZARD_UI_COMMIT"
          # Our pin is the one the simulator's source names for this profile
          # (its Dockerfile still names an older one, #160's review).
          pin="$RUNNER_TEMP/sim/data/blizzard-ui-builds/$SIM_PROFILE.json"
          grep -qF "\"gethe_revision\": \"$BLIZZARD_UI_COMMIT\"" "$pin"
          grep -qF "\"version\": \"$BLIZZARD_UI_VERSION\"" "$pin"
          # As SIM_COMMIT's Dockerfile does: the tree must be exactly the
          # file list the simulator was built for.
          manifest="$RUNNER_TEMP/sim/data/blizzard-ui-files/$SIM_PROFILE.txt"
          # The difference is written out first, and the job log gets only its
          # start, marked by shown (#317): bash -e has no pipefail here, so a
          # pipe straight into shown would hide the failure.
          diff -u <(LC_ALL=C sort "$manifest") \
            <(git -C "$ui" ls-tree -r --name-only HEAD Interface/AddOns/ | cut -d/ -f3- | LC_ALL=C sort) \
            > "$RUNNER_TEMP/tree-diff.txt" || {
            echo "Blizzard's UI tree and the simulator's list of files differ (the start of the difference):"
            head -n 200 "$RUNNER_TEMP/tree-diff.txt" | head -c 20000 | shown
            exit 1
          }
          # The markers the simulator's own image writes, so it uses this
          # cache and never tries to fetch game files itself. The list's hash
          # is taken before the cd and kept as hex digits only (#360).
          manifest_sha=$(sha256sum "$manifest" | cut -d' ' -f1 | tr -cd '0-9a-f')
          test "${#manifest_sha}" -eq 64
          cd "$ui/Interface/AddOns"
          printf 'profile=%s\nversion=%s\nsource=gethe-image-build\ngethe_revision=%s\nmanifest_sha256=%s\nfallback=none\n' \
            "$SIM_PROFILE" "$BLIZZARD_UI_VERSION" "$BLIZZARD_UI_COMMIT" "$manifest_sha" \
            > .wow-ui-sim-blizzard-ui-provenance
          touch .wow-ui-sim-blizzard-ui-complete

      - name: Build a build image (the Dockerfile's build tools)
        if: steps.sim-cache.outputs.cache-hit != 'true'
        run: |
          docker build -t ff-build - <<DOCKERFILE
          FROM $BUILD_BASE
          RUN apt-get update -q && apt-get install -yq --no-install-recommends \
                $BUILD_PACKAGES \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          # Published binaries use the commit's portable CI config.
          cp "$RUNNER_TEMP/sim/.cargo/config.ci.toml" "$RUNNER_TEMP/sim/.cargo/config.toml"
          mkdir -p "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/sim-target"

      # The only container with network: cargo fetch downloads the crates
      # Cargo.lock names, checks their checksums and unpacks them, and runs
      # none of their code. The sources stay read-only.
      - name: Download the simulator's locked dependencies
        if: steps.sim-cache.outputs.cache-hit != 'true'
        run: |
          # The crates' own output is untrusted (#153, #164): see the ui-sim
          # job's shown. pipefail keeps the download's exit status through it.
          shown() { tr '\r' '\n' | sed -e "s/^/${1:-| }/" -e 's/##\[/##(/g'; }
          set -o pipefail
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CARGO_HOME=/cargo -e RUSTUP_TOOLCHAIN="$BUILD_TOOLCHAIN" \
            -v "$RUNNER_TEMP/sim:/build:ro" -v "$RUNNER_TEMP/cargo-home:/cargo" -w /build \
            ff-build cargo fetch --locked 2>&1 | shown

      # wow-sim is the simulator; wow-cli is its tool, built here only for
      # the spell data step below.
      - name: Build the simulator with its renderer (no network, sources read-only)
        if: steps.sim-cache.outputs.cache-hit != 'true'
        run: |
          # The build runs the simulator's build scripts and macros, so its
          # output is untrusted (#153, #164): see the ui-sim job's shown.
          # pipefail keeps the build's exit status through it.
          shown() { tr '\r' '\n' | sed -e "s/^/${1:-| }/" -e 's/##\[/##(/g'; }
          set -o pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target \
            -e CARGO_PROFILE_RELEASE_STRIP="$BUILD_STRIP" -e RUSTUP_TOOLCHAIN="$BUILD_TOOLCHAIN" \
            --memory 12g --memory-swap 12g --pids-limit 8192 \
            -v "$RUNNER_TEMP/sim:/build:ro" -v "$RUNNER_TEMP/cargo-home:/cargo:ro" \
            -v "$RUNNER_TEMP/sim-target:/target" -w /build \
            ff-build cargo build --release --locked --offline --bin wow-sim --bin wow-cli \
              --no-default-features --features "$BUILD_FEATURES" 2>&1 | shown

      # The Forever profile needs Forever's spell data, which only the
      # simulator's own tool makes, by downloading five tables from
      # Blizzard's CDN (#160; the owner accepted network for this step only).
      # It is the one run of the simulator's code with any network, and it
      # gets as little as will do:
      # - its container is on a Docker network made with --internal, which
      #   has no route out and answers no outside name;
      # - the only thing it can reach there is a proxy (tinyproxy, Debian's,
      #   on the pinned base), which refuses everything but an HTTPS tunnel
      #   to a host in SPELL_DATA_HOSTS on port 443: no other host, no other
      #   port and no plain HTTP;
      # - it gets the tool read-only and one empty folder to write, and has
      #   no capabilities and no secrets.
      # What it wrote is then checked by the step after this one. The proxy's
      # log shows every host it asked for.
      - name: Download Forever's spell data (network to Blizzard's CDN only)
        if: steps.sim-cache.outputs.cache-hit != 'true'
        run: |
          # The tool's output is untrusted (#153): see the ui-sim job's shown.
          shown() { tr '\r' '\n' | sed -e "s/^/${1:-| }/" -e 's/##\[/##(/g'; }
          cli="$RUNNER_TEMP/sim-target/release/wow-cli"
          test -f "$cli"
          test ! -L "$cli"
          mkdir -p "$RUNNER_TEMP/spell-cli" "$RUNNER_TEMP/spell-proxy" "$RUNNER_TEMP/spell-out"
          cp -P "$cli" "$RUNNER_TEMP/spell-cli/wow-cli"
          # The proxy's settings: nothing but a CONNECT (an HTTPS tunnel) to
          # a listed host, by exact name, on port 443. FilterURLs makes the
          # filter read the whole request target, "host:443" for a CONNECT
          # and "http://..." for a plain request, so each filter line names
          # the host with its port and no plain request can match one.
          # Without it the filter reads the host alone, and plain HTTP to a
          # listed host passes on any port (#314's architecture review; both
          # tried against tinyproxy 1.11.1, Debian bookworm's).
          printf '%s\n' 'Port 8888' 'Listen 0.0.0.0' 'Timeout 60' 'MaxClients 20' 'ConnectPort 443' \
            'FilterDefaultDeny Yes' 'FilterType ere' 'FilterURLs On' 'Filter "/proxy/filter"' 'LogLevel Connect' \
            > "$RUNNER_TEMP/spell-proxy/tinyproxy.conf"
          # Read as words, never as file patterns: a * must be refused, not matched.
          read -ra hosts <<< "$SPELL_DATA_HOSTS"
          for host in "${hosts[@]}"; do
            case "$host" in "" | *[!a-z0-9.-]*) echo "not a plain host name in SPELL_DATA_HOSTS"; exit 1 ;; esac
            printf '^%s:443$\n' "${host//./\\.}"
          done > "$RUNNER_TEMP/spell-proxy/filter"
          test -s "$RUNNER_TEMP/spell-proxy/filter"
          chmod -R a-w "$RUNNER_TEMP/spell-cli" "$RUNNER_TEMP/spell-proxy"
          docker build -t ff-proxy - <<DOCKERFILE
          FROM $RENDER_BASE
          RUN apt-get update -q && apt-get install -yq --no-install-recommends tinyproxy \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker network create --internal ff-cdn
          docker run -d --name ff-proxy --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/spell-proxy:/proxy:ro" \
            ff-proxy tinyproxy -d -c /proxy/tinyproxy.conf
          docker network connect ff-cdn ff-proxy
          sleep 2
          status=0
          timeout -s TERM -k 10 300 docker run --rm --init --network ff-cdn --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e WOW_SIM_CASC=0 -e HTTPS_PROXY=http://ff-proxy:8888 \
            --memory 2g --memory-swap 2g --pids-limit 512 \
            -v "$RUNNER_TEMP/spell-cli:/cli:ro" -v "$RUNNER_TEMP/spell-out:/spells" \
            ff-build /cli/wow-cli casc sync-forever-spells --source cdn --output /spells/spells.json > "$RUNNER_TEMP/spell-data.log" 2>&1 || status=$?
          head -c 20000 "$RUNNER_TEMP/spell-data.log" | shown
          echo "wow-cli: exit $status (124: stopped at the time limit)"
          echo "what the proxy was asked for:"
          docker logs ff-proxy 2>&1 | grep -E 'Request \(|refused' | head -200 | shown "proxy> " || true
          docker rm -f ff-proxy >/dev/null
          docker network rm ff-cdn >/dev/null
          [ "$status" -eq 0 ]

      # What the simulator's image holds: the binary (stripped by the build,
      # as the image's is), with the test framework run-tests loads from
      # Interface/AddOns and the spell data it reads from spells/ beside it,
      # and Blizzard's UI code. The build's output and the downloaded spell
      # data are untrusted, so the runner only copies them, and only plain
      # files, never a link: nothing here reads or runs them outside a
      # sandbox before the check below.
      - name: Stage the simulator for the other jobs
        if: steps.sim-cache.outputs.cache-hit != 'true'
        run: |
          out="$RUNNER_TEMP/ui-sim-build"
          bin="$RUNNER_TEMP/sim-target/release/wow-sim"
          mkdir -p "$out/sim/Interface/AddOns" "$out/blizzard-ui"
          test -f "$bin"
          test ! -L "$bin"
          cp -P "$bin" "$out/sim/wow-sim"
          spells="$RUNNER_TEMP/spell-out/spells.json"
          test -f "$spells"
          test ! -L "$spells"
          mkdir -p "$out/sim/spells/$SIM_PROFILE"
          cp -P "$spells" "$out/sim/spells/$SIM_PROFILE/spells.json"
          cp -r "$RUNNER_TEMP/sim/Interface/AddOns/TestFramework" "$out/sim/Interface/AddOns/"
          cp -r "$RUNNER_TEMP/blizzard-ui/Interface/AddOns" "$out/blizzard-ui/"

      # Runs after a restore as well as after a build, and before the save,
      # so nothing unchecked is ever cached: a restored cache is as
      # untrusted as anything the build made. The binary must be a plain
      # file, and nothing in the tree may be a link or any other special
      # file; the upload below would follow or carry them on.
      #
      # The spell data must be the reviewed download, byte for byte (#160):
      # its SHA-256 must be SPELL_DATA_SHA256, or the job stops here, before
      # anything is saved, uploaded or run. A mismatch is named in an
      # annotation, which holds only the hash, in hex. Only a file with the
      # pinned hash is then read: scripts/sim-spell-check.py proves that
      # every spell in scripts/data/forever-spells.json, the copy whose hash
      # the simulator's own spec records (#209), has the same rows here.
      - name: Check the staged files are plain files, and the spell data is the pinned one
        run: |
          out="$RUNNER_TEMP/ui-sim-build"
          test -f "$out/sim/wow-sim"
          test ! -L "$out/sim/wow-sim"
          test -d "$out/sim/Interface/AddOns/TestFramework"
          test -d "$out/blizzard-ui/AddOns"
          test -z "$(find "$out" -mindepth 1 ! -type f ! -type d -print -quit)"
          spells="$out/sim/spells/$SIM_PROFILE/spells.json"
          test -f "$spells"
          test ! -L "$spells"
          test "$(stat -c %s "$spells")" -le 1048576
          actual=$(sha256sum "$spells" | cut -d' ' -f1)
          case "$actual" in "" | *[!0-9a-f]*) actual=unreadable ;; esac
          if [ "$actual" != "$SPELL_DATA_SHA256" ]; then
            echo "::error title=UI simulator: Forever spell data is not the pinned download::Its SHA-256 is $actual, which is not SPELL_DATA_SHA256. Nothing was cached, uploaded or run."
            exit 1
          fi
          python3 -I scripts/sim-spell-check.py "$spells" scripts/data/forever-spells.json

      # Saved as soon as it is staged and checked, so a later failure or a
      # cancelled run still keeps it.
      - name: Save the staged simulator build
        if: steps.sim-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ui-sim-build
          key: ${{ steps.key.outputs.key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-sim-build
          path: ${{ runner.temp }}/ui-sim-build
          # Blizzard's UI cache markers are dot files.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  ui-sim:
    needs: simulator
    runs-on: ubuntu-24.04
    # Its simulator runs stop themselves (three at 2 minutes, two at 5, each
    # with 10 s to exit), and each one stopped runs once more (#173): about
    # 34 minutes if all five hung twice, inside this.
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package the addon as it ships
        run: make package

      - name: Stage the packaged addon with the UI scenarios
        run: |
          addons="$RUNNER_TEMP/addons"
          mkdir -p "$addons" "$RUNNER_TEMP/report"
          unzip -q dist/FriendlyForever-*.zip -d "$addons"
          cp -r uitests "$addons/FriendlyForever/tests"
          chmod -R a-w "$addons"

      # run-tests has no screen size option (it uses 1600 x 1200), but
      # dump-tree does, so the same scenarios and layout checks also run
      # there, at 1024 x 768 (the narrowest layout) and 1920 x 1080 (what
      # most players use) (#148). One script: the stand-in test runner, then
      # each scenario file wrapped so its locals stay its own.
      - name: Stage the scenarios for the sized layout passes
        run: |
          layout="$RUNNER_TEMP/layout-lua"
          mkdir -p "$layout"
          {
            cat scripts/ui-sim-harness.lua
            for file in button_states pages scenarios; do
              printf '\ndo\nlocal function scenarios(...)\n'
              cat "uitests/$file.lua"
              printf '\nend\nscenarios()\nend\n'
            done
            printf '\nFriendlyForeverHarnessFinish()\n'
          } > "$layout/layout.lua"
          chmod -R a-w "$layout"

      - name: Get the simulator built by the simulator job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-sim-build
          path: ${{ runner.temp }}/ui-sim-build

      - name: Build a run image (Mesa software drivers)
        run: |
          chmod -R a-w "$RUNNER_TEMP/ui-sim-build"
          chmod a+x "$RUNNER_TEMP/ui-sim-build/sim/wow-sim"
          docker build -t ff-render - <<DOCKERFILE
          FROM $RENDER_BASE
          RUN apt-get update -q && apt-get install -yq --no-install-recommends \
                libicu72 libegl1 libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers fonts-dejavu-core \
              && rm -rf /var/lib/apt/lists/* \
              && test -f "$RENDER_FONT"
          DOCKERFILE

      - name: Run the simulator (no network, addon read-only)
        run: |
          # The simulator plays Forever (SIM_PROFILE), whose interface
          # version is our TOC's (16001), so the addon loads as it does in
          # the game. As the simulator's image does: no saved variables,
          # Blizzard's UI where it looks, and the spell data beside the
          # binary (WOW_SIM_CASC=0: never look for game files).
          # Each command is stopped after 2 minutes if it hasn't finished (they
          # take seconds), so one that never exits can't hold up the job; its
          # output so far is kept, and the log says how each one ended (#154).
          # One that's stopped runs once more (#173).
          exec 3>&1
          sandbox() {
            local started=$SECONDS status=0
            timeout -s TERM -k 10 120 docker run --rm --init --network none --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -e WOW_SIM_NO_SAVED_VARS=1 -e WOW_SIM_CASC=0 -e WOW_SIM_FALLBACK_FONT="$RENDER_FONT" \
              -v "$RUNNER_TEMP/ui-sim-build/sim:/sim:ro" \
              -v "$RUNNER_TEMP/ui-sim-build/blizzard-ui/AddOns:/tmp/.cache/wow-ui-sim/blizzard-ui/$SIM_PROFILE/AddOns:ro" \
              -v "$RUNNER_TEMP/addons:/test-addons:ro" ff-render /sim/wow-sim --addons-path /test-addons "$@" || status=$?
            echo "$1: exit $status after $((SECONDS - started)) s (124: stopped at the time limit)" >&3
            return "$status"
          }
          # The scenarios again at one size (#148); the frame tree stays in its
          # log. Stopped after 5 minutes if it hasn't finished, so a pass that
          # never exits can't hold up the job; its output so far is kept.
          sized() {
            local status=0
            timeout -s TERM -k 10 300 docker run --rm --init --network none --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -e WOW_SIM_NO_SAVED_VARS=1 -e WOW_SIM_CASC=0 -e WOW_SIM_FALLBACK_FONT="$RENDER_FONT" \
              -v "$RUNNER_TEMP/ui-sim-build/sim:/sim:ro" \
              -v "$RUNNER_TEMP/ui-sim-build/blizzard-ui/AddOns:/tmp/.cache/wow-ui-sim/blizzard-ui/$SIM_PROFILE/AddOns:ro" \
              -v "$RUNNER_TEMP/addons:/test-addons:ro" -v "$RUNNER_TEMP/layout-lua:/layout-lua:ro" \
              ff-render /sim/wow-sim --addons-path /test-addons --exec-lua @/layout-lua/layout.lua \
              dump-tree --filter FriendlyForever --width "${1%x*}" --height "${1#*x}" || status=$?
            [ "$status" -eq 0 ] || echo "layout pass $1: exit $status" >&3
            return "$status"
          }
          # Runs one of them into its report file (and stderr into a second
          # file, if one is given). A run stopped at its time limit (124) keeps
          # what it wrote as <file>.timed-out and runs once more (#173). Each
          # attempt's end goes to runs.txt, which only this step writes, for
          # the summary: the run's name, the attempt, its exit and its time.
          attempt() {
            local name="$1" out="$2" err="$3" try status started
            shift 3
            for try in 1 2; do
              started=$SECONDS status=0
              if [ -n "$err" ]; then "$@" > "$out" 2> "$err" || status=$?; else "$@" > "$out" 2>&1 || status=$?; fi
              echo "$name $try $status $((SECONDS - started))" >> "$RUNNER_TEMP/runs.txt"
              if [ "$status" -ne 124 ] || [ "$try" -eq 2 ]; then break; fi
              mv "$out" "$out.timed-out"
              if [ -n "$err" ]; then mv "$err" "$err.timed-out"; fi
            done
          }
          report="$RUNNER_TEMP/report"
          attempt lua-errors "$report/lua-errors.json" "$report/lua-errors.log" sandbox lua-errors
          attempt run-tests "$report/run-tests.log" "" sandbox run-tests FriendlyForever
          attempt dump-tree "$report/frame-tree.txt" "" sandbox dump-tree --filter FriendlyForever
          for size in $LAYOUT_SIZES; do
            attempt "layout-$size" "$report/layout-$size.log" "" sized "$size"
          done

      - name: Show the reports in the log
        run: |
          # Simulator and shot output is untrusted (#153). shown puts a mark
          # before each line, so the runner, which skips leading spaces, never
          # reads one as a workflow command (::); turns carriage returns, which
          # also end a line for the runner, into new lines; and breaks the old
          # ##[ command, which the runner finds anywhere in a line.
          shown() { tr '\r' '\n' | sed -e "s/^/${1:-| }/" -e 's/##\[/##(/g'; }
          for file in "$RUNNER_TEMP"/report/*; do
            echo "::group::$(basename "$file")"
            head -c 60000 "$file" | shown
            echo
            echo "::endgroup::"
          done

      - name: Digest (client facts and Friendly Forever load errors)
        run: |
          # The simulator's output, shown as in the step above (#153).
          shown() { tr '\r' '\n' | sed -e "s/^/${1:-| }/" -e 's/##\[/##(/g'; }
          report="$RUNNER_TEMP/report"
          {
            # The simulator logs each A_Print line twice (as it runs, and in its
            # console at the end), so repeats are dropped.
            echo "--- client facts"
            grep "FACT " "$report/run-tests.log" | awk '!seen[$0]++' | grep . || echo "none printed"
            echo "--- layout"
            grep "LAYOUT " "$report/run-tests.log" | awk '!seen[$0]++' | grep . || echo "none printed"
            echo "--- scenario results"
            grep -E "✓|✗|tests," "$report/run-tests.log" || true
            for size in $LAYOUT_SIZES; do
              echo "--- layout at $size (#148)"
              grep "LAYOUT " "$report/layout-$size.log" | awk '!seen[$0]++' | grep . || echo "none printed"
              echo "--- scenario results at $size"
              grep -E "✓|✗|tests," "$report/layout-$size.log" | awk '!seen[$0]++' || true
            done
            echo "--- load errors naming FriendlyForever"
            grep -i -B2 -A8 "FriendlyForever" "$report/lua-errors.json" | head -80 || echo "none"
            echo "--- frame tree lines naming FriendlyForever"
            grep -i "FriendlyForever" "$report/frame-tree.txt" | head -40 || echo "none"
          } 2>&1 | shown

      - name: Summary
        run: |
          report="$RUNNER_TEMP/report"
          # Simulator output, shown as in the steps above (#153). In the
          # summary its mark also stops a line from closing a code block.
          shown() { tr '\r' '\n' | sed -e "s/^/${1:-| }/" -e 's/##\[/##(/g'; }
          # What each run is, and the report file it writes (the run step's names).
          what() {
            case "$1" in
              run-tests) echo "The main pass (run-tests, at 1600x1200)" ;;
              layout-*) echo "The layout pass at ${1#layout-}" ;;
              *) echo "The $1 run" ;;
            esac
          }
          fileOf() {
            case "$1" in
              lua-errors) echo "$report/lua-errors.log" ;;
              dump-tree) echo "$report/frame-tree.txt" ;;
              *) echo "$report/$1.log" ;;
            esac
          }
          # Runs stopped at their time limit (exit 124), from the run step's
          # runs.txt (#173): each is named at the top of the summary, with the
          # last scenario it started and the end of its log, and in an
          # annotation, which a Claude session can read when it can't read
          # the summary. Report only: nothing here fails the job. The
          # annotation holds only the runner's own words and the scenario's
          # number, digits only, never the simulator's text.
          exec 3>&1
          timeouts() {
            local name try status seconds file last again
            [ -f "$RUNNER_TEMP/runs.txt" ] || return 0
            while read -r name try status seconds; do
              [ "$status" = 124 ] || continue
              file=$(fileOf "$name")
              [ "$try" = 2 ] || file="$file.timed-out"
              last=$(grep -o 'START [0-9]*' "$file" | tail -n 1 | tr -cd '0-9') || true
              if [ "$try" = 2 ]; then
                echo "### ⚠️ $(what "$name") timed out twice: its results are incomplete"
                echo "::warning title=UI simulator: a run timed out twice::$(what "$name") was stopped at its time limit twice, so its results (LAYOUT lines included) are incomplete. Last scenario started: ${last:-none}. See the run's summary." >&3
              else
                again=$(grep "^$name 2 " "$RUNNER_TEMP/runs.txt" | cut -d' ' -f3 || true)
                echo "### ⚠️ $(what "$name") timed out once, and ran again (exit ${again:-none})"
                echo "::notice title=UI simulator: a run timed out once::$(what "$name") was stopped at its time limit and ran again (exit ${again:-none}). Last scenario started: ${last:-none}." >&3
              fi
              echo
              echo "Stopped after $seconds s, on attempt $try of 2. The last scenario it started:"
              echo '```'
              grep 'START [0-9]' "$file" | tail -n 1 | shown || true
              echo '```'
              echo "The end of its log:"
              echo '```'
              tail -n 15 "$file" | shown || true
              echo '```'
            done < "$RUNNER_TEMP/runs.txt"
          }
          {
            echo "## UI simulator (report only)"
            echo
            timeouts
            echo "### Lua errors while loading (from FriendlyForever files)"
            echo '```'
            grep -i "FriendlyForever" "$report/lua-errors.json" | head -50 || echo "none"
            echo '```'
            echo "### Layout checks"
            echo '```'
            grep "LAYOUT " "$report/run-tests.log" | awk '!seen[$0]++' | grep . || echo "none printed"
            echo '```'
            for size in $LAYOUT_SIZES; do
              echo "### Layout checks at $size"
              echo '```'
              grep "LAYOUT " "$report/layout-$size.log" | awk '!seen[$0]++' | grep . || echo "none printed"
              grep -E "✗|tests," "$report/layout-$size.log" | awk '!seen[$0]++' || true
              echo '```'
            done
            echo "### UI scenarios"
            echo '```'
            tail -60 "$report/run-tests.log"
            echo '```'
            echo "### Client facts"
            echo '```'
            grep "FACT " "$report/run-tests.log" | awk '!seen[$0]++' | grep . || echo "none printed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-sim-report
          path: ${{ runner.temp }}/report

  # Level B: screenshots of our own frames, from the simulator job's build.
  screenshots:
    needs: simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 87
    continue-on-error: true
    env:
      # The options panel's tabs, one shot each (#112): uitests/pages.lua's
      # Pages.TABS names, in the panel's order (spec/uitests_pages_spec.lua
      # checks they match).
      OPTIONS_TABS: guild-login buff-thanks guild-join party-join party-hello hello-again level-up buff-back
      # The walkthrough's steps shot (#47): uitests/pages.lua's
      # Pages.WALKTHROUGH_STEPS names (spec/uitests_pages_spec.lua checks
      # they match).
      WALKTHROUGH_STEPS: welcome buff-mode-key buff-mode-triggers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package the addon as it ships
        run: make package

      - name: Stage the packaged addon
        run: |
          addons="$RUNNER_TEMP/addons"
          mkdir -p "$addons" "$RUNNER_TEMP/shots" "$RUNNER_TEMP/shot-logs"
          unzip -q dist/FriendlyForever-*.zip -d "$addons"
          chmod -R a-w "$addons"

      # One script per state of the buff-back button (#83), per filled
      # options page (#52) and per options tab (#112): the scenarios' own setup
      # (uitests/button_states.lua or uitests/pages.lua), then what to show.
      - name: Stage the screenshot scripts
        run: |
          states="$RUNNER_TEMP/shot-lua"
          mkdir -p "$states"
          for state in favour buffmode bufflist buffgroup alreadydone longreason; do
            { cat uitests/button_states.lua; printf '\nFriendlyForeverUIStates.Show("%s")\n' "$state"; } \
              > "$states/$state.lua"
          done
          # The phase 1 options pages (#52), filled by uitests/pages.lua, and
          # Start here (#47).
          for page in general ledger start; do
            { cat uitests/pages.lua; printf '\nFriendlyForeverUIPages.Show("%s")\n' "$page"; } \
              > "$states/page-$page.lua"
          done
          # Each tab of the main panel, opened by clicking its button (#112).
          for tab in $OPTIONS_TABS; do
            { cat uitests/pages.lua; printf '\nFriendlyForeverUIPages.ShowTab("%s")\n' "$tab"; } \
              > "$states/tab-$tab.lua"
          done
          # The Buff Back tab scrolled to its lower rows, from "Use group versions" down (#254).
          { cat uitests/pages.lua; printf '\nFriendlyForeverUIPages.ShowTabLower("buff-back")\n'; } \
            > "$states/tab-buff-back-lower.lua"
          # The walkthrough at each step shot, taken again from Start here (#47).
          for step in $WALKTHROUGH_STEPS; do
            { cat uitests/pages.lua; printf '\nFriendlyForeverUIPages.ShowWalkthrough("%s")\n' "$step"; } \
              > "$states/walkthrough-$step.lua"
          done
          chmod -R a-w "$states"

      - name: Get the simulator built by the simulator job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-sim-build
          path: ${{ runner.temp }}/ui-sim-build

      - name: Build a render image (Mesa software drivers)
        run: |
          chmod -R a-w "$RUNNER_TEMP/ui-sim-build"
          chmod a+x "$RUNNER_TEMP/ui-sim-build/sim/wow-sim"
          docker build -t ff-render - <<DOCKERFILE
          FROM $RENDER_BASE
          RUN apt-get update -q && apt-get install -yq --no-install-recommends \
                libicu72 libegl1 libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers fonts-dejavu-core \
              && rm -rf /var/lib/apt/lists/* \
              && test -f "$RENDER_FONT"
          DOCKERFILE

      - name: Take screenshots (no network, addon read-only)
        # A backstop: the shots below stop themselves inside this. Every shot
        # that hits its own 180 s limit takes about 200 s with its checks and
        # clean-up, so a pass of 27 shots can take about 90 minutes in the
        # worst case, and both passes together about 180. No shot starts
        # after SHOT_CUTOFF (4200 s, 70 minutes) of the step, in either pass,
        # so the last one ends by about 4400 s with the probe: inside this
        # step's 75 minutes (4500 s). (Each usually takes about 8 s, so a
        # normal run takes about 8 minutes and never nears the cut-off.)
        # spec/repo_spec.lua counts the shots and checks these numbers (#309).
        timeout-minutes: 75
        run: |
          # WOW_SIM_CASC=0: never look for game files (no WoW install here).
          # Each shot runs as a detached container capped at 6 GB and 3 CPUs,
          # so a runaway render can't starve the runner. It's watched every
          # 5 s, shows progress every 30 s, and is killed after 3 minutes.
          # It renders off screen (no virtual display: xvfb-run sat idle under
          # Docker), as the runner's own user so it can write the PNG into the
          # runner's folder (with every capability dropped, root can't), with
          # HOME in the container's /tmp and Blizzard's UI where it looks.
          # Each shot is saved as <name><SUFFIX>.png at WIDTH x HEIGHT. The
          # first pass is 1024 x 768 (no suffix), the second 1920 x 1080
          # (-1920x1080) (#148). Neither starts a shot after SHOT_CUTOFF
          # seconds, so the step's time limit above still holds (#309).
          SHOT_CUTOFF=4200
          # Only the PNGs go in the one folder a container can write
          # (/shots): the runner keeps each shot's log in shot-logs, which no
          # container mounts, so a shot can't plant a link there for the
          # runner's redirect to follow (#147).
          # Simulator and shot output is untrusted (#153). shown puts a mark
          # before each line, so the runner, which skips leading spaces, never
          # reads one as a workflow command (::); turns carriage returns, which
          # also end a line for the runner, into new lines; and breaks the old
          # ##[ command, which the runner finds anywhere in a line.
          shown() { tr '\r' '\n' | sed -e "s/^/${1:-| }/" -e 's/##\[/##(/g'; }
          shoot() {
            local name="$1"; shift
            local cid
            if [ "$SECONDS" -gt "$SHOT_CUTOFF" ]; then
              echo "$name$SUFFIX: skipped, out of time"
              return
            fi
            cid=$(docker run -d --init --network none --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" -e HOME=/tmp -e XDG_RUNTIME_DIR=/tmp \
              --memory 6g --memory-swap 6g --cpus 3 --pids-limit 4096 \
              -e WOW_SIM_NO_SAVED_VARS=1 -e WOW_SIM_FALLBACK_FONT="$RENDER_FONT" \
              -e WOW_SIM_CASC=0 -e WOW_SIM_VERBOSE=1 \
              -e LIBGL_ALWAYS_SOFTWARE=1 -e WOW_SIM_SOFTWARE_RENDER=1 -e WGPU_BACKEND=gl \
              -v "$RUNNER_TEMP/ui-sim-build/sim:/sim:ro" \
              -v "$RUNNER_TEMP/ui-sim-build/blizzard-ui/AddOns:/tmp/.cache/wow-ui-sim/blizzard-ui/$SIM_PROFILE/AddOns:ro" \
              -v "$RUNNER_TEMP/addons:/test-addons:ro" \
              -v "$RUNNER_TEMP/shot-lua:/shot-lua:ro" \
              -v "$RUNNER_TEMP/shots:/shots" \
              ff-render /sim/wow-sim --addons-path /test-addons "$@" \
              screenshot --png --width "$WIDTH" --height "$HEIGHT" -o "/shots/$name$SUFFIX.png")
            local waited=0 result="timed out after 180 s"
            while [ "$waited" -lt 180 ]; do
              if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
                result="exited with $(docker inspect -f '{{.State.ExitCode}}' "$cid") after ${waited} s"
                break
              fi
              if [ $((waited % 30)) -eq 0 ]; then
                echo "$name: ${waited} s, $(docker stats --no-stream --format '{{.MemUsage}} cpu {{.CPUPerc}}' "$cid")"
                docker logs --tail 2 "$cid" 2>&1 | shown "  $name> "
              fi
              sleep 5
              waited=$((waited + 5))
            done
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" = "true" ]; then
              echo "$name: still running at the limit; its processes:"
              docker top "$cid" -eo pid,stat,etime,args 2>&1 | shown "  $name> " || true
            fi
            docker kill "$cid" >/dev/null 2>&1 || true
            docker logs "$cid" > "$RUNNER_TEMP/shot-logs/$name$SUFFIX.log" 2>&1 || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
            echo "$name$SUFFIX: $result"
          }
          # First, that the simulator starts at all in this image.
          probe=$(docker run -d --init --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/ui-sim-build/sim:/sim:ro" ff-render /sim/wow-sim --help)
          sleep 10
          docker logs "$probe" 2>&1 | head -40 | shown "  probe> "
          docker rm -f "$probe" >/dev/null 2>&1 || true
          # Every shot, at the size and suffix the pass set (#148).
          shoot_all() {
            # The game screen as a new install shows it: the simulator has no
            # saved settings, so the addon is off and its walkthrough open
            # (#47). The other shots skip it first, by its Skip button, as a
            # player would, which turns the addon on.
            shoot game
            # Each tab of the options panel (#112), named after the tab:
            # options-guild-login (the tab the panel opens on), options-buff-thanks...
            for tab in $OPTIONS_TABS; do
              shoot "options-$tab" --exec-lua "@/shot-lua/tab-$tab.lua"
            done
            # The Buff Back tab scrolled to "Use group versions" (#254): the rows below the turn-on triggers.
            shoot options-buff-back-lower --exec-lua "@/shot-lua/tab-buff-back-lower.lua"
            # The Buff Thanks tab (#101), with the longest "Thank them with" choice.
            shoot options-buff --exec-lua "if FriendlyForeverWalkthrough and FriendlyForeverWalkthrough:IsShown() then FriendlyForeverWalkthrough.skip:Click() end; FriendlyForeverDB.buff.thankStyle = 'both'; SlashCmdList.FRIENDLYFOREVER(''); for _, f in ipairs({ FriendlyForeverOptionsPanel:GetChildren() }) do local c = f.GetScrollChild and f:GetScrollChild(); for _, b in ipairs(c and { c:GetChildren() } or {}) do if b.GetText and b:GetText() == 'Buff Thanks' then b:GetScript('OnClick')(b) end end end"
            # The General page (#35): it doesn't scroll, so everything must fit.
            shoot general --exec-lua "if FriendlyForeverWalkthrough and FriendlyForeverWalkthrough:IsShown() then FriendlyForeverWalkthrough.skip:Click() end; SlashCmdList.FRIENDLYFOREVER(''); Settings.OpenToCategory(FriendlyForeverOptionsPanel.generalPage.category:GetID())"
            # /friendly move shows the buff back button, unlocked, with nobody owed.
            shoot button --exec-lua "if FriendlyForeverWalkthrough and FriendlyForeverWalkthrough:IsShown() then FriendlyForeverWalkthrough.skip:Click() end; SlashCmdList.FRIENDLYFOREVER('move')"
            # A favour owed: someone outside your group buffed you.
            shoot button-favour --exec-lua @/shot-lua/favour.lua
            # Buff mode, with a party member missing your buff.
            shoot button-buffmode --exec-lua @/shot-lua/buffmode.lua
            # The list beside the button (#43): a favour and three party members, one with a very long name.
            shoot button-bufflist --exec-lua @/shot-lua/bufflist.lua
            # A group cast in the list (#227): one row for the party, not one per member.
            shoot button-buffgroup --exec-lua @/shot-lua/buffgroup.lua
            # "Already done by" (#256): a buff another member put up in step as you entered, in red.
            shoot button-alreadydone --exec-lua @/shot-lua/alreadydone.lua
            # A long reason the button shows (#270): wrapped whole, the button grown to hold it.
            shoot button-longreason --exec-lua @/shot-lua/longreason.lua
            # The General and Favour Ledger pages, filled with long names and
            # many entries, and the copy window as /friendly export opens it (#52).
            shoot options-general --exec-lua @/shot-lua/page-general.lua
            shoot options-ledger --exec-lua @/shot-lua/page-ledger.lua
            # Start here, and the walkthrough at each step in WALKTHROUGH_STEPS (#47).
            shoot options-start --exec-lua @/shot-lua/page-start.lua
            for step in $WALKTHROUGH_STEPS; do
              shoot "walkthrough-$step" --exec-lua "@/shot-lua/walkthrough-$step.lua"
            done
            shoot copy-window --exec-lua "if FriendlyForeverWalkthrough and FriendlyForeverWalkthrough:IsShown() then FriendlyForeverWalkthrough.skip:Click() end; SlashCmdList.FRIENDLYFOREVER('export')"
            # The palette (#46): chat lines in each colour, and the minimap tooltip.
            # The chat frame is cleared first and the commands are few, so every line stays in
            # view (#190): muted (debug on, then its log lines), bad ("disabled"), good
            # ("enabled") and warn (ignoring a name with no surname).
            shoot palette --exec-lua "if FriendlyForeverWalkthrough and FriendlyForeverWalkthrough:IsShown() then FriendlyForeverWalkthrough.skip:Click() end; DEFAULT_CHAT_FRAME:Clear(); for _, c in ipairs({ 'debug', 'off', 'on', 'ignore Bob' }) do SlashCmdList.FRIENDLYFOREVER(c) end; FriendlyForeverMinimapButton:GetScript('OnEnter')(FriendlyForeverMinimapButton)"
          }
          for size in $LAYOUT_SIZES; do
            WIDTH="${size%x*}"; HEIGHT="${size#*x}"
            case "$size" in 1024x768) SUFFIX="" ;; *) SUFFIX="-$size" ;; esac
            shoot_all
          done
          ls -laq "$RUNNER_TEMP/shots" "$RUNNER_TEMP/shot-logs" 2>&1 | shown
          for log in "$RUNNER_TEMP"/shot-logs/*.log; do
            echo "::group::$(basename "$log")"; tail -60 "$log" | shown; echo "::endgroup::"
          done

      # A shot could plant a link in its folder, and the upload would read
      # through it into the artifact. So first remove every container (a
      # cancelled or timed-out step leaves its detached shot running), then
      # keep only plain .png files (find -P follows no link). find names a
      # file it can't delete on stderr, so its output is marked by shown, and
      # pipefail keeps its exit status through it (#360).
      - name: Keep only plain PNG files in the shots folder
        if: always()
        run: |
          shown() { tr '\r' '\n' | sed -e "s/^/${1:-| }/" -e 's/##\[/##(/g'; }
          set -o pipefail
          docker ps -aq | xargs -r docker rm -f >/dev/null 2>&1 || true
          find -P "$RUNNER_TEMP/shots" -mindepth 1 ! \( -type f -name '*.png' \) -delete 2>&1 | shown

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-sim-screenshots
          path: ${{ runner.temp }}/shots

      # Beside the PNGs, not in their folder: one artifact would put both
      # folders under a common parent and move the PNGs the publish job reads.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-sim-screenshot-logs
          path: ${{ runner.temp }}/shot-logs

  # Publishes the screenshots where reviewers (people, and Claude sessions,
  # whose network reaches git but not artifact storage) can open them: an
  # orphan branch per pull request, ui-screenshots/pr-<number>, replaced on
  # every run of that pull request. ui-screenshots-cleanup.yml deletes each
  # when its pull request closes (#106). This job runs nothing from the
  # simulator or the pull request: it only checks the files are PNG images
  # of a sane size and commits them. It alone may write, and only for pull
  # requests from this repository. Just before it pushes, it checks that the
  # pull request is still open (#347): a run still going when its pull
  # request closes would otherwise put back the branch the clean-up has
  # just deleted.
  publish-screenshots:
    needs: screenshots
    # Not in a cancelled run (a newer push replaces it), which has no
    # screenshots to publish.
    # Nor when the screenshot job was skipped because no UI file changed.
    if: ${{ !cancelled() && needs.screenshots.result != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    # pull-requests: read only for the open check before the push (#347).
    permissions:
      contents: write
      pull-requests: read
    steps:
      # No artifact (the screenshot job stopped early) means nothing to publish.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ui-sim-screenshots
          path: shots

      - name: Commit the PNGs to ui-screenshots/pr-${{ github.event.pull_request.number }}
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/publish"
          mkdir -p "$out"
          count=0
          for f in shots/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            # Only plain names, real PNG files, at most 5 MB each.
            # A name outside that set isn't printed: it could carry a workflow command (#153).
            # What's read from a file is kept as digits (hex for the header) only (#360).
            case "$name" in *[!A-Za-z0-9._-]*) echo "skipping a file with an unsafe name"; continue ;; esac
            [ "$(head -c 8 "$f" | od -An -tx1 | tr -cd '0-9a-f')" = "89504e470d0a1a0a" ] || { echo "not a PNG: $name"; continue; }
            [ "$(stat -c %s "$f" | tr -cd '0-9')" -le 5242880 ] || { echo "too big: $name"; continue; }
            cp "$f" "$out/$name"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then echo "no screenshots to publish"; exit 0; fi
          printf 'Screenshots for pull request #%s at %s, from the UI simulator.\n' "$PR" "$HEAD_SHA" > "$out/README.md"
          cd "$out"
          git init -q
          git checkout -q --orphan "ui-screenshots/pr-$PR"
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots for #$PR at $HEAD_SHA"
          # --- open check (#347) ---
          # Publishes only while the pull request is open, checked just before
          # the push: a run still going when its pull request closes would
          # otherwise put back the branch ui-screenshots-cleanup.yml has just
          # deleted. Closed, or a lookup that fails or says anything else,
          # publishes nothing and never fails the job. Nothing from the answer
          # is printed. The token goes to curl on stdin, never on its command
          # line. The step runs as bash -e without pipefail, the shell the
          # tests use: a failed curl gives jq nothing, so the state is empty.
          state=$(printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" |
            curl -sSf -K - -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$REPO/pulls/$PR" |
            jq -r '.state' 2> /dev/null) || state=
          case "$state" in
            open) ;;
            closed) skipped="pull request #$PR is closed" ;;
            *) skipped="pull request #$PR couldn't be looked up" ;;
          esac
          if [ "$state" != open ]; then
            echo "not publishing: $skipped"
            {
              echo "## UI screenshots"
              echo
              echo "Not published: $skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --- end of open check ---
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push -q --force "https://github.com/$REPO.git" "HEAD:refs/heads/ui-screenshots/pr-$PR"
          echo "published $count screenshot(s) to ui-screenshots/pr-$PR"
          {
            echo "## UI screenshots"
            echo
            echo "$count screenshot(s) for $HEAD_SHA: https://github.com/$REPO/tree/ui-screenshots/pr-$PR"
          } >> "$GITHUB_STEP_SUMMARY"
