name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1, busted and luacheck
        run: make setup TOOLS="$RUNNER_TEMP/lua"

      - name: Lint
        run: make lint TOOLS="$RUNNER_TEMP/lua"

      - name: Test
        run: make test TOOLS="$RUNNER_TEMP/lua"

      - name: Package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: FriendlyForever
          path: dist/*.zip
