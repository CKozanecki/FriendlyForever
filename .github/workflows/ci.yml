name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libreadline-dev

      - name: Install Lua 5.1, busted and luacheck
        run: make setup TOOLS="$RUNNER_TEMP/lua"

      - name: Lint
        run: make lint TOOLS="$RUNNER_TEMP/lua"

      - name: Test
        run: make test TOOLS="$RUNNER_TEMP/lua"

      - name: Package
        run: make package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FriendlyForever
          path: dist/*.zip
