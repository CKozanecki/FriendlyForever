name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The setup script and its checksums pin the tools, so they key the cache.
      - name: Cache Lua tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lua
          key: lua-tools-${{ runner.os }}-${{ hashFiles('Makefile', 'scripts/dev-setup.sh', 'scripts/dev-setup.lock') }}

      # Always installed: cached Lua still links against readline at run time.
      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libreadline-dev

      # Always run: from the cache it only checks the install, in seconds.
      - name: Install Lua 5.1, busted and luacheck
        run: make setup TOOLS="$RUNNER_TEMP/lua"

      - name: Lint
        run: make lint TOOLS="$RUNNER_TEMP/lua"

      - name: Test
        run: make test TOOLS="$RUNNER_TEMP/lua"

      - name: Package
        run: make package

      # Build the zip the way a release does (no upload, no secrets) and check
      # it holds the same files as scripts/package.sh's.
      - name: Write this version's release notes
        run: make release-notes

      - name: Build with the release packager
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d
          pandoc: "false"

      - name: Compare release and local packages
        run: ./scripts/compare-packages.sh dist/FriendlyForever-*.zip .release/FriendlyForever-*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FriendlyForever
          path: |
            dist/*.zip
            .release/*.zip
          include-hidden-files: true
