name: UI simulator trial

# Trial of the headless WoW UI simulator wow-ui-sim (issue #49). Report only:
# its results never fail CI, and nothing here is trusted beyond this job.
#
# Safety:
# - The image is pinned by digest (release 0.1.36), so it can't change
#   under us; read the source at that release before moving the pin.
# - The job has read-only access to the repository and no secrets.
# - The container runs with no network, no capabilities and no privilege
#   escalation, and sees the packaged addon read-only. We don't use the
#   project's own Action: it pulls a moving tag, mounts the repository
#   read-write and puts an input into a shell command unquoted.

on:
  pull_request:
    paths:
      - "uitests/**"
      - ".github/workflows/ui-sim-trial.yml"
      - "*.lua"
      - "*.toc"
      - "*.xml"
  workflow_dispatch:

concurrency:
  group: ui-sim-trial-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/osso/wow-ui-sim@sha256:7e663dfd59e364d9df212afa1cde40e7051c1fc65b1b3652ac84769a5ac9b292

jobs:
  ui-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package the addon as it ships
        run: make package

      - name: Stage the packaged addon with the UI scenarios
        run: |
          addons="$RUNNER_TEMP/addons"
          mkdir -p "$addons" "$RUNNER_TEMP/report"
          unzip -q dist/FriendlyForever-*.zip -d "$addons"
          cp -r uitests "$addons/FriendlyForever/tests"
          chmod -R a-w "$addons"

      - name: Pull the simulator, pinned by digest
        run: docker pull "$IMAGE"

      - name: Run the simulator (no network, addon read-only)
        run: |
          # Our TOC is for Forever (interface 16001); the simulator runs the
          # retail 12.1.5 UI that Forever's is built on, so load it the way
          # the game's "Load out of date AddOns" box would.
          sandbox() {
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
              -e WOW_SIM_LOAD_OUT_OF_DATE_ADDONS=1 \
              -v "$RUNNER_TEMP/addons:/test-addons:ro" "$IMAGE" --addons-path /test-addons "$@"
          }
          sandbox lua-errors > "$RUNNER_TEMP/report/lua-errors.json" 2> "$RUNNER_TEMP/report/lua-errors.log" || true
          sandbox run-tests FriendlyForever > "$RUNNER_TEMP/report/run-tests.log" 2>&1 || true
          sandbox dump-tree --filter FriendlyForever > "$RUNNER_TEMP/report/frame-tree.txt" 2>&1 || true

      - name: Show the reports in the log
        run: |
          for file in "$RUNNER_TEMP"/report/*; do
            echo "::group::$(basename "$file")"
            head -c 60000 "$file"
            echo
            echo "::endgroup::"
          done

      - name: Digest (client facts and Friendly Forever load errors)
        run: |
          report="$RUNNER_TEMP/report"
          echo "--- client facts"
          grep "FACT " "$report/run-tests.log" || echo "none printed"
          echo "--- scenario results"
          grep -E "✓|✗|tests," "$report/run-tests.log" || true
          echo "--- load errors naming FriendlyForever"
          grep -i -B2 -A8 "FriendlyForever" "$report/lua-errors.json" | head -80 || echo "none"
          echo "--- frame tree lines naming FriendlyForever"
          grep -i "FriendlyForever" "$report/frame-tree.txt" | head -40 || echo "none"

      - name: Summary
        run: |
          report="$RUNNER_TEMP/report"
          {
            echo "## UI simulator trial (report only)"
            echo
            echo "### Lua errors while loading (from FriendlyForever files)"
            echo '```'
            grep -i "FriendlyForever" "$report/lua-errors.json" | head -50 || echo "none"
            echo '```'
            echo "### UI scenarios"
            echo '```'
            tail -60 "$report/run-tests.log"
            echo '```'
            echo "### Client facts"
            echo '```'
            grep "FACT " "$report/run-tests.log" || echo "none printed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-sim-trial-report
          path: ${{ runner.temp }}/report

  # Level B: screenshots of our own frames. The published image is built
  # without the simulator's renderer, so this job builds it from the same
  # reviewed release (v0.1.36, the commit behind the image above) and renders
  # on the CPU with Mesa's software driver. No Blizzard art is fetched, so
  # Blizzard's textures are missing: text, layout and our own colors show.
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    env:
      SIM_REPO: https://github.com/Osso/wow-ui-sim.git
      SIM_COMMIT: 3b369ee1aafeb85089b7c63e8a0a99e56f8c2dd0 # v0.1.36
      BLIZZARD_UI_COMMIT: b9be9379719047977fca4dba1bb1d9988e8840b3 # pinned by that release's Dockerfile
      RENDER_BASE: ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac # 24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package the addon as it ships
        run: make package

      - name: Stage the packaged addon
        run: |
          addons="$RUNNER_TEMP/addons"
          mkdir -p "$addons" "$RUNNER_TEMP/shots"
          unzip -q dist/FriendlyForever-*.zip -d "$addons"
          chmod -R a-w "$addons"

      - name: Fetch the simulator and Blizzard's UI code at their pinned commits
        run: |
          git init -q "$RUNNER_TEMP/sim"
          git -C "$RUNNER_TEMP/sim" fetch -q --depth 1 "$SIM_REPO" "$SIM_COMMIT"
          git -C "$RUNNER_TEMP/sim" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sim" rev-parse HEAD)" = "$SIM_COMMIT"

          ui="$RUNNER_TEMP/blizzard-ui"
          git init -q "$ui"
          git -C "$ui" fetch -q --depth 1 https://github.com/Gethe/wow-ui-source.git "$BLIZZARD_UI_COMMIT"
          git -C "$ui" sparse-checkout set Interface/AddOns
          git -C "$ui" checkout -q --detach FETCH_HEAD
          test "$(git -C "$ui" rev-parse HEAD)" = "$BLIZZARD_UI_COMMIT"
          # The markers the simulator's own image writes, so it uses this
          # cache and never tries to fetch game files itself.
          cd "$ui/Interface/AddOns"
          printf 'profile=retail\nversion=12.1.5.70448\nsource=gethe-image-build\ngethe_revision=%s\nfallback=none\n' \
            "$BLIZZARD_UI_COMMIT" > .wow-ui-sim-blizzard-ui-provenance
          touch .wow-ui-sim-blizzard-ui-complete

      - name: Install build dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq mold clang pkg-config libicu-dev

      - name: Cache the simulator build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/sim/target
          key: wow-ui-sim-${{ env.SIM_COMMIT }}-gui

      - name: Build the simulator with its renderer
        working-directory: ${{ runner.temp }}/sim
        run: |
          cp .cargo/config.ci.toml .cargo/config.toml
          cargo build --release --locked --bin wow-sim --no-default-features --features "gui client-retail"

      - name: Build a render image (Mesa software drivers, virtual display)
        run: |
          docker build -t ff-render - <<DOCKERFILE
          FROM $RENDER_BASE
          RUN apt-get update -q && apt-get install -yq --no-install-recommends \
                libicu74 libegl1 libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers xvfb xauth fonts-dejavu-core \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: Take screenshots (no network, addon read-only)
        run: |
          shoot() {
            local name="$1"; shift
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
              -e WOW_SIM_LOAD_OUT_OF_DATE_ADDONS=1 -e WOW_SIM_NO_SAVED_VARS=1 \
              -e LIBGL_ALWAYS_SOFTWARE=1 -e WOW_SIM_SOFTWARE_RENDER=1 -e WGPU_BACKEND=gl \
              -v "$RUNNER_TEMP/sim/target/release:/sim:ro" \
              -v "$RUNNER_TEMP/blizzard-ui/Interface/AddOns:/root/.cache/wow-ui-sim/blizzard-ui/retail/AddOns:ro" \
              -v "$RUNNER_TEMP/addons:/test-addons:ro" \
              -v "$RUNNER_TEMP/shots:/shots" \
              ff-render xvfb-run -a /sim/wow-sim --addons-path /test-addons "$@" \
              screenshot --png -o "/shots/$name.png" > "$RUNNER_TEMP/shots/$name.log" 2>&1 \
              && echo "$name: ok" || echo "$name: failed (see $name.log)"
          }
          shoot game
          shoot options --exec-lua "SlashCmdList.FRIENDLYFOREVER('')"
          ls -la "$RUNNER_TEMP/shots"
          for log in "$RUNNER_TEMP"/shots/*.log; do
            echo "::group::$(basename "$log")"; tail -40 "$log"; echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-sim-screenshots
          path: ${{ runner.temp }}/shots
